  <text x="800" y="600" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="700" fill="rgba(255,255,255,0.95)">Akrilik vs Galvanil, 6 Bulan Uji Lapangan</text>
