    <rect x="60" y="-90" width="180" height="180" rx="10" fill="rgba(255,102,52,0.18)" stroke="#ff6634" stroke-width="5"/>
    <text x="150" y="22" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="rgba(255,255,255,0.95)">G</text>
