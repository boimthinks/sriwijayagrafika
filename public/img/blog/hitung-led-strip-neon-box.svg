<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#224da8"/>
      <stop offset="100%" stop-color="#ff6634"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="rgba(255,255,255,0.08)"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#g)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <g transform="translate(800, 380)">
    <rect x="-180" y="-100" width="360" height="200" rx="10" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.85)" stroke-width="5"/>
    <text x="0" y="-30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="rgba(255,255,255,0.95)">LED</text>
    <text x="0" y="20" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" fill="#ff6634">x modul/m2</text>
    <text x="0" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="500" fill="rgba(255,255,255,0.85)">x watt = total</text>
    <circle cx="-120" cy="-70" r="6" fill="#ff6634"/>
    <circle cx="120" cy="-70" r="6" fill="rgba(255,102,52,0.6)"/>
  </g>
  <text x="800" y="600" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="700" fill="rgba(255,255,255,0.95)">Hitung Kebutuhan LED Strip</text>
  <text x="800" y="650" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="500" fill="rgba(255,255,255,0.75)">Neon Box 1x1 Meter · Sriwijaya Grafika</text>
</svg>
